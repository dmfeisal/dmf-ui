name: DMF UI source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dmf-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Source / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install isolated React alpha dependencies
        run: npm ci --prefix packages/react
      - name: Verify React alpha contracts and hydration
        run: npm test --prefix packages/react
      - name: Check source
        run: npm run check
      - name: Build documentation
        run: npm run build
      - name: Build real Astro navigation fixture
        run: npm run build:dmf-ui:navigation
      - name: Verify distribution and browser harness contracts
        run: npm test
